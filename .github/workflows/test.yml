name: Test
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  bats:
    name: Bash hook tests (bats)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install bash-side dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bats sqlite3 jq uuid-runtime
      - name: Set up Node (needed by release-tarball.bats which runs scripts/build-tarball.sh)
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mcp/goal-server/package-lock.json
      - name: Install MCP server deps (build-tarball.sh prunes from these)
        working-directory: mcp/goal-server
        run: npm ci
      - name: Run unit bats
        run: bats tests/unit/
      - name: Run integration bats
        run: bats tests/integration/

  vitest:
    name: MCP server tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mcp/goal-server/package-lock.json
      - name: Install
        working-directory: mcp/goal-server
        run: npm ci
      - name: Test
        working-directory: mcp/goal-server
        run: npm test
