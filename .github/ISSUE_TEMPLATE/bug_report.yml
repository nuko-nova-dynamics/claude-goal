name: Bug report
description: Something in claude-goal didn't behave as expected
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Short description of the behavior you saw vs. what you expected.
      placeholder: |
        I ran `/goal "..."` and ...
        I expected ...
        Instead ...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: The exact `/goal` command you ran (redact anything sensitive) and any preceding state.
      render: text
    validations:
      required: true

  - type: input
    id: cc-version
    attributes:
      label: Claude Code version
      description: Output of `claude --version`
      placeholder: "2.1.139"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Linux (specify distro in "Additional context")
        - WSL
        - Other
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: claude-goal version
      description: From `.claude-plugin/plugin.json` or the release tarball filename
      placeholder: "0.1.0"
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: /goal-doctor output
      description: Run `/goal-doctor` in the affected session and paste the full output. This catches most environment issues.
      render: text

  - type: textarea
    id: db-state
    attributes:
      label: DB state at the time
      description: |
        Optional but very helpful. Run:
        ```
        sqlite3 ~/.claude/plugins/data/claude-goal*/goals.db \
          "SELECT session_id, objective, status, paused_reason, tokens_used, token_budget, continuations_remaining, accounting_uncertain FROM goals;"
        ```
        (Or whatever path `CLAUDE_PLUGIN_DATA` resolves to on your machine.)
      render: text

  - type: textarea
    id: hook-log
    attributes:
      label: Hook log slice
      description: |
        From `~/.claude/plugins/data/claude-goal*/logs/<YYYYMMDD>.log`, grep around the time of the bug:
        ```
        grep -E "\[ERROR\]|paused_degraded|stop:|post-tool-batch:" <log>
        ```
      render: text

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else — distro, shell, custom hooks, parallel sessions, etc.
