<svg xmlns="http://www.w3.org/2000/svg" width="560" height="120" viewBox="0 0 560 120" fill="none">
  <style>
    .mono { font-family: 'IBM Plex Mono', 'JetBrains Mono', 'Menlo', monospace; }
    .body { font-family: 'Inter', -apple-system, system-ui, sans-serif; }
  </style>
  <!-- Goal mark: concentric rings centered on a coral bullseye -->
  <g transform="translate(60 60)">
    <circle r="44" fill="none" stroke="#d0d0d0" stroke-width="2"/>
    <circle r="30" fill="none" stroke="#a8a8a8" stroke-width="2"/>
    <circle r="16" fill="none" stroke="#707070" stroke-width="2"/>
    <circle r="6" fill="#D97757"/>
  </g>
  <!-- Wordmark -->
  <text x="130" y="58" class="mono" font-size="34" font-weight="600" fill="#1a1a1a" letter-spacing="-0.5">claude</text>
  <text x="276" y="58" class="mono" font-size="34" font-weight="300" fill="#a8a8a8">/</text>
  <text x="294" y="58" class="mono" font-size="34" font-weight="600" fill="#D97757" letter-spacing="-0.5">goal</text>
  <!-- Tagline -->
  <text x="130" y="84" class="body" font-size="14" font-weight="400" fill="#6a6a6a" letter-spacing="0.5">autonomous goal loop for claude code</text>
</svg>
